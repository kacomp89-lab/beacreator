<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Community - BeaCreator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#4c1d95',
                            neon: '#a855f7',
                            glow: '#c084fc',
                            darkbg: '#09090b',
                            cardbg: '#121216',
                            bordercol: '#27272a'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
        }
        .neon-glow {
            box-shadow: 0 0 25px -5px rgba(168, 85, 247, 0.35);
        }
        .neon-glow-sm {
            box-shadow: 0 0 12px -2px rgba(139, 92, 246, 0.3);
        }
        .glass-panel {
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(39, 39, 42, 0.6);
        }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen flex flex-col selection:bg-purple-500 selection:text-white">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 glass-panel border-b border-zinc-800/80 px-4 lg:px-8 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-pink-500 flex items-center justify-center neon-glow-sm">
                <i class="fa-solid fa-wand-magic-sparkles text-white text-lg"></i>
            </div>
            <div>
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-purple-200 to-purple-400 bg-clip-text text-transparent">BeaCreator</span>
                <span class="hidden sm:inline-block ml-2 px-2 py-0.5 text-[10px] font-semibold bg-purple-950/80 text-purple-300 rounded-full border border-purple-800/50">Community Hub</span>
            </div>
        </div>

        <nav class="hidden md:flex items-center space-x-1 bg-zinc-900/90 p-1.5 rounded-2xl border border-zinc-800">
            <button onclick="window.location.href='index.html'" class="px-4 py-2 rounded-xl text-xs font-semibold text-zinc-400 hover:text-white transition-all flex items-center space-x-2">
                <i class="fa-solid fa-house"></i>
                <span>Studio</span>
            </button>
            <button class="px-4 py-2 rounded-xl text-xs font-semibold bg-purple-600 text-white shadow-lg shadow-purple-600/30 flex items-center space-x-2">
                <i class="fa-solid fa-users"></i>
                <span>Community Feed</span>
            </button>
        </nav>

        <div class="flex items-center space-x-3">
            <button onclick="openUploadModal()" class="px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs transition-all shadow-lg shadow-purple-600/30 flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>Upload Video</span>
            </button>
        </div>
    </header>

    <!-- MAIN FEED -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 lg:p-6 pb-28 space-y-6">
        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-purple-950/60 via-indigo-950/40 to-zinc-900 border border-purple-500/20 p-6 lg:p-8 neon-glow">
            <div class="max-w-2xl space-y-3">
                <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/30 text-purple-300 text-xs font-semibold">
                    <i class="fa-solid fa-fire text-purple-400"></i>
                    <span>Creator Showcase & Feedback Arena</span>
                </div>
                <h1 class="text-2xl lg:text-4xl font-extrabold text-white">Explore Creator Shorts & Long Videos</h1>
                <p class="text-zinc-400 text-xs lg:text-sm">Upload original MP4 video files to share globally with creators worldwide.</p>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="flex items-center space-x-2 border-b border-zinc-800 pb-3">
            <button onclick="filterVideos('all')" id="filter-all" class="px-4 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold transition-all">All Videos</button>
            <button onclick="filterVideos('short')" id="filter-short" class="px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white text-xs font-bold transition-all">Shorts / Reels</button>
            <button onclick="filterVideos('long')" id="filter-long" class="px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white text-xs font-bold transition-all">Long Videos</button>
        </div>

        <!-- Video Feed Grid -->
        <div id="video-feed" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- UPLOAD MODAL -->
    <div id="upload-modal" class="fixed inset-0 z-50 bg-[#09090b]/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-lg p-6 rounded-3xl border border-purple-500/30 neon-glow space-y-4 relative">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-video text-purple-400 mr-2"></i>Upload Global Video</h3>
                <button onclick="closeUploadModal()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form onsubmit="handleGlobalUpload(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-zinc-300">Video Title</label>
                    <input type="text" id="vid-title" required placeholder="e.g., How I Gained 10k Subs in 30 Days" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-zinc-300">Format</label>
                        <select id="vid-type" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                            <option value="short">Short / Reel (Vertical 9:16)</option>
                            <option value="long">Long Video (Horizontal 16:9)</option>
                        </select>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-zinc-300">Select Video File (.mp4)</label>
                        <input type="file" id="vid-file" accept="video/mp4,video/webm" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-xs text-zinc-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-purple-600 file:text-white">
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-zinc-300">Description / Hook Strategy</label>
                    <textarea id="vid-desc" rows="3" required placeholder="Explain your hook or what viewers will learn..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 resize-none"></textarea>
                </div>
                <button type="submit" id="upload-submit-btn" class="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm transition-all shadow-lg shadow-purple-600/30 flex items-center justify-center space-x-2">
                    <span>Publish Globally</span>
                </button>
            </form>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        // PASTE YOUR SUPABASE PROJECT URL AND ANON KEY HERE
        const SUPABASE_URL = "https://kdanylytvxsktgosvgjw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_bhk8btpWpfdFtgxnkV05-w_rbkKl3Ye";

        let supabase = null;
        try {
            if (window.supabase && SUPABASE_URL !== "https://kdanylytvxsktgosvgjw.supabase.co") {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Supabase init error:", e);
        }

        let currentFilter = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            loadGlobalVideos('all');
        });

        function openUploadModal() {
            const modal = document.getElementById('upload-modal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeUploadModal() {
            const modal = document.getElementById('upload-modal');
            if (modal) modal.classList.add('hidden');
        }

        async function handleGlobalUpload(event) {
            event.preventDefault();
            if (!supabase) {
                alert("Please add your Supabase URL and Anon Key in the script before uploading!");
                return;
            }

            const title = document.getElementById('vid-title').value.trim();
            const type = document.getElementById('vid-type').value;
            const fileInput = document.getElementById('vid-file').files[0];
            const desc = document.getElementById('vid-desc').value.trim();
            const author = localStorage.getItem('beacreator_user_name') || 'Creator';
            const btn = document.getElementById('upload-submit-btn');

            if (!fileInput) return;

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Uploading to Cloud...`;

            try {
                const fileName = `${Date.now()}_${fileInput.name.replace(/[^a-zA-Z0-9._-]/g, "")}`;
                const { data: storageData, error: storageError } = await supabase.storage
                    .from('videos')
                    .upload(fileName, fileInput);

                if (storageError) throw new Error("Storage Error: " + storageError.message);

                const { data: publicUrlData } = supabase.storage
                    .from('videos')
                    .getPublicUrl(fileName);

                const videoUrl = publicUrlData.publicUrl;

                const { error: dbError } = await supabase.from('videos').insert([
                    { title, description: desc, video_url: videoUrl, format: type, author, likes: 0 }
                ]);

                if (dbError) throw new Error("Database Error: " + dbError.message);

                btn.disabled = false;
                btn.innerHTML = `<span>Publish Globally</span>`;
                closeUploadModal();
                document.getElementById('vid-title').value = '';
                document.getElementById('vid-desc').value = '';
                document.getElementById('vid-file').value = '';
                loadGlobalVideos(currentFilter);
            } catch (error) {
                alert(error.message);
                btn.disabled = false;
                btn.innerHTML = `<span>Publish Globally</span>`;
            }
        }

        function filterVideos(filter) {
            currentFilter = filter;
            ['all', 'short', 'long'].forEach(t => {
                const btn = document.getElementById(`filter-${t}`);
                if (btn) {
                    btn.className = t === filter ? "px-4 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold transition-all" : "px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white text-xs font-bold transition-all";
                }
            });
            loadGlobalVideos(filter);
        }

        async function loadGlobalVideos(filter) {
            const feed = document.getElementById('video-feed');
            feed.innerHTML = `<div class="col-span-full py-20 text-center text-zinc-400 text-sm animate-pulse"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading global community feed...</div>`;

            if (!supabase) {
                feed.innerHTML = `<div class="col-span-full py-16 text-center text-amber-400 text-sm glass-panel rounded-3xl border border-amber-500/30 p-6 space-y-2"><strong>Supabase Not Connected</strong><p class="text-xs text-zinc-400">Please paste your Supabase Project URL and Anon Key at the top of the script section to view global community videos.</p></div>`;
                return;
            }

            try {
                let query = supabase.from('videos').select('*').order('created_at', { ascending: false });
                if (filter !== 'all') {
                    query = query.eq('format', filter);
                }

                const { data: videos, error } = await query;
                if (error) throw error;

                if (!videos || videos.length === 0) {
                    feed.innerHTML = `<div class="col-span-full py-20 text-center text-zinc-500 text-sm glass-panel rounded-3xl border border-zinc-800">No videos found in the community network. Be the first to upload!</div>`;
                    return;
                }

                feed.innerHTML = videos.map(v => `
                    <div class="glass-panel rounded-3xl border border-zinc-800 overflow-hidden flex flex-col space-y-3 group">
                        <div class="relative w-full ${v.format === 'short' ? 'aspect-[9/16] max-h-80' : 'aspect-video'} bg-black flex items-center justify-center">
                            <video src="${v.video_url}" controls preload="metadata" class="w-full h-full object-contain"></video>
                        </div>
                        <div class="p-5 space-y-2 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between text-xs text-zinc-500 mb-1">
                                    <span class="px-2 py-0.5 rounded-full bg-purple-500/10 text-purple-300 font-semibold uppercase text-[10px]">${v.format === 'short' ? 'Short' : 'Long Video'}</span>
                                    <span><i class="fa-solid fa-user mr-1"></i> ${escapeHtml(v.author)}</span>
                                </div>
                                <h3 class="text-base font-bold text-white">${escapeHtml(v.title)}</h3>
                                <p class="text-xs text-zinc-400 line-clamp-2 mt-1">${escapeHtml(v.description || '')}</p>
