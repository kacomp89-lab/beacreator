<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeaCreator Video Stream - Creator Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#4c1d95',
                            neon: '#a855f7',
                            glow: '#c084fc',
                            darkbg: '#09090b',
                            cardbg: '#121216',
                            bordercol: '#27272a'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
        }
        .neon-glow {
            box-shadow: 0 0 25px -5px rgba(168, 85, 247, 0.35);
        }
        .neon-glow-sm {
            box-shadow: 0 0 12px -2px rgba(139, 92, 246, 0.3);
        }
        .glass-panel {
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(39, 39, 42, 0.6);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7c3aed;
        }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen flex flex-col selection:bg-purple-500 selection:text-white">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 glass-panel border-b border-zinc-800/80 px-4 lg:px-8 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-pink-500 flex items-center justify-center neon-glow-sm">
                <i class="fa-solid fa-play text-white text-lg"></i>
            </div>
            <div>
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-purple-200 to-purple-400 bg-clip-text text-transparent">BeaCreator Stream</span>
                <span class="hidden sm:inline-block ml-2 px-2 py-0.5 text-[10px] font-semibold bg-purple-950/80 text-purple-300 rounded-full border border-purple-800/50">Independent Network</span>
            </div>
        </div>

        <nav class="hidden md:flex items-center space-x-1 bg-zinc-900/90 p-1.5 rounded-2xl border border-zinc-800">
            <button onclick="window.location.href='index.html'" class="px-4 py-2 rounded-xl text-xs font-semibold text-zinc-400 hover:text-white transition-all flex items-center space-x-2">
                <i class="fa-solid fa-house"></i>
                <span>Studio</span>
            </button>
            <button class="px-4 py-2 rounded-xl text-xs font-semibold bg-purple-600 text-white shadow-lg shadow-purple-600/30 flex items-center space-x-2">
                <i class="fa-solid fa-video"></i>
                <span>Video Stream</span>
            </button>
        </nav>

        <div class="flex items-center space-x-3">
            <button onclick="openUploadModal()" class="px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs transition-all shadow-lg shadow-purple-600/30 flex items-center space-x-2">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Upload Video</span>
            </button>
        </div>
    </header>

    <!-- CONTENT FEED -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 lg:p-6 pb-28 space-y-6">
        <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
            <div>
                <h1 class="text-2xl font-extrabold text-white">Creator Video Stream</h1>
                <p class="text-xs text-zinc-400">Watch and upload original shorts and long-form video concepts.</p>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="filterFeed('all')" id="filter-all" class="px-3 py-1.5 rounded-xl bg-purple-600 text-white text-xs font-bold transition-all">All</button>
                <button onclick="filterFeed('short')" id="filter-short" class="px-3 py-1.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 text-xs font-bold transition-all">Shorts</button>
                <button onclick="filterFeed('long')" id="filter-long" class="px-3 py-1.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 text-xs font-bold transition-all">Long-form</button>
            </div>
        </div>

        <!-- Video Stream Grid -->
        <div id="native-video-feed" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- UPLOAD MODAL -->
    <div id="upload-modal" class="fixed inset-0 z-50 bg-[#09090b]/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-lg p-6 rounded-3xl border border-purple-500/30 neon-glow space-y-4 relative">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-video text-purple-400 mr-2"></i>Upload Original Video</h3>
                <button onclick="closeUploadModal()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form onsubmit="handleNativeUpload(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-zinc-300">Video Title</label>
                    <input type="text" id="up-title" required placeholder="e.g., Behind the Scenes AI Workflow" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-zinc-300">Format</label>
                        <select id="up-type" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                            <option value="short">Short / Reel (Vertical 9:16)</option>
                            <option value="long">Long Video (Horizontal 16:9)</option>
                        </select>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-zinc-300">Select Video File (.mp4)</label>
                        <input type="file" id="up-file" accept="video/mp4,video/webm" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-xs text-zinc-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-purple-600 file:text-white">
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-zinc-300">Description / Notes</label>
                    <textarea id="up-desc" rows="3" required placeholder="What is this video about..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 resize-none"></textarea>
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm transition-all shadow-lg shadow-purple-600/30">
                    Publish Video
                </button>
            </form>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        let nativeVideos = JSON.parse(localStorage.getItem('beacreator_native_videos') || '[]');

        window.addEventListener('DOMContentLoaded', () => {
            renderNativeFeed('all');
        });

        function openUploadModal() {
            document.getElementById('upload-modal').classList.remove('hidden');
        }

        function closeUploadModal() {
            document.getElementById('upload-modal').classList.add('hidden');
        }

        function handleNativeUpload(e) {
            e.preventDefault();
            const title = document.getElementById('up-title').value.trim();
            const type = document.getElementById('up-type').value;
            const fileInput = document.getElementById('up-file').files[0];
            const desc = document.getElementById('up-desc').value.trim();
            const author = localStorage.getItem('beacreator_user_name') || 'Creator';

            if (!fileInput) return;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                const videoDataUrl = uploadEvent.target.result;

                const newVideo = {
                    id: Date.now(),
                    title,
                    type,
                    videoUrl: videoDataUrl,
                    desc,
                    author,
                    likes: 1,
                    date: new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
                };

                nativeVideos.unshift(newVideo);
                localStorage.setItem('beacreator_native_videos', JSON.stringify(nativeVideos));
                closeUploadModal();
                renderNativeFeed('all');
            };
            reader.readAsDataURL(fileInput);
        }

        function filterFeed(type) {
            ['all', 'short', 'long'].forEach(t => {
                const btn = document.getElementById(`filter-${t}`);
                if (btn) {
                    btn.className = t === type ? "px-3 py-1.5 rounded-xl bg-purple-600 text-white text-xs font-bold transition-all" : "px-3 py-1.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 text-xs font-bold transition-all";
                }
            });
            renderNativeFeed(type);
        }

        function renderNativeFeed(filter) {
            const feed = document.getElementById('native-video-feed');
            let filtered = nativeVideos;
            if (filter !== 'all') {
                filtered = nativeVideos.filter(v => v.type === filter);
            }

            if (filtered.length === 0) {
                feed.innerHTML = `<div class="col-span-full py-20 text-center text-zinc-500 text-sm glass-panel rounded-3xl border border-zinc-800">No original videos uploaded yet. Click "Upload Video" to add your first short or long video!</div>`;
                return;
            }

            feed.innerHTML = filtered.map(v => `
                <div class="glass-panel rounded-3xl border border-zinc-800 overflow-hidden flex flex-col space-y-3 group">
                    <div class="relative w-full ${v.type === 'short' ? 'aspect-[9/16] max-h-96' : 'aspect-video'} bg-black flex items-center justify-center">
                        <video src="${v.videoUrl}" controls class="w-full h-full object-contain"></video>
                    </div>
                    <div class="p-5 space-y-2 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between text-xs text-zinc-500 mb-1">
                                <span class="px-2 py-0.5 rounded-full bg-purple-500/10 text-purple-300 font-semibold uppercase text-[10px]">${v.type === 'short' ? 'Short' : 'Long Video'}</span>
                                <span><i class="fa-solid fa-user mr-1"></i> ${escapeHtml(v.author)}</span>
                            </div>
                            <h3 class="text-base font-bold text-white">${escapeHtml(v.title)}</h3>
                            <p class="text-xs text-zinc-400 line-clamp-2 mt-1">${escapeHtml(v.desc)}</p>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-zinc-800/80 text-xs text-zinc-400">
                            <span>${v.date}</span>
                            <button onclick="likeVideo(${v.id})" class="flex items-center space-x-1 hover:text-purple-400 transition-colors">
                                <i class="fa-solid fa-heart text-purple-500"></i>
                                <span class="font-bold text-white">${v.likes}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function likeVideo(id) {
            const vid = nativeVideos.find(v => v.id === id);
            if (vid) {
                vid.likes++;
                localStorage.setItem('beacreator_native_videos', JSON.stringify(nativeVideos));
                renderNativeFeed('all');
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
