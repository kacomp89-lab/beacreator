<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Community - BeaCreator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#4c1d95',
                            neon: '#a855f7',
                            glow: '#c084fc',
                            darkbg: '#09090b',
                            cardbg: '#121216',
                            bordercol: '#27272a'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            overflow-x: hidden;
        }
        /* Lightweight shadows instead of GPU-heavy blurs for low-end devices */
        .neon-glow {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        .neon-glow-sm {
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.25);
        }
        /* Solid high-opacity background avoids expensive backdrop-filter repaints */
        .glass-panel {
            background: rgba(18, 18, 22, 0.96);
            border: 1px solid rgba(39, 39, 42, 0.8);
        }

        .feed-columns {
            display: grid;
            grid-template-columns: minmax(300px, .85fr) minmax(0, 1.4fr);
            gap: 1.5rem;
            align-items: start;
        }
        .feed-columns.single-col {
            grid-template-columns: minmax(0, 1fr);
        }
        .feed-column { min-width: 0; }
        .column-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }
        .shorts-scroll {
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-height: 78vh;
            overflow-y: auto;
            padding: 2px 8px 14px 2px;
            scroll-snap-type: y mandatory;
            scrollbar-width: thin;
            scrollbar-color: #6d28d9 #18181b;
            -webkit-overflow-scrolling: touch;
        }
        .short-card {
            position: relative;
            isolation: isolate;
            contain: content;
            scroll-snap-align: start;
            height: min(70vh, 680px);
            min-height: 430px;
            border: 1px solid rgba(168, 85, 247, .25);
            border-radius: 20px;
            overflow: hidden;
            background: #000;
        }
        .short-card video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .short-gradient {
            position: absolute;
            inset: 40% 0 0;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(transparent, rgba(0, 0, 0, .88));
        }
        .short-meta {
            position: absolute;
            z-index: 2;
            left: 16px;
            right: 72px;
            bottom: 18px;
        }
        .short-actions {
            position: absolute;
            z-index: 3;
            right: 12px;
            bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .short-action {
            width: 48px;
            min-height: 48px;
            border-radius: 999px;
            background: rgba(24, 24, 27, .9);
            border: 1px solid rgba(255, 255, 255, .16);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: #fff;
            transition: background-color .15s;
        }
        .short-action:hover:not(:disabled) {
            background: rgba(124, 58, 237, .9);
        }
