<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Community - BeaCreator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#4c1d95',
                            neon: '#a855f7',
                            glow: '#c084fc',
                            darkbg: '#09090b',
                            cardbg: '#121216',
                            bordercol: '#27272a'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
        }
        .neon-glow {
            box-shadow: 0 0 25px -5px rgba(168, 85, 247, 0.35);
        }
        .neon-glow-sm {
            box-shadow: 0 0 12px -2px rgba(139, 92, 246, 0.3);
        }
        .glass-panel {
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(39, 39, 42, 0.6);
        }

        html { scroll-behavior: smooth; }
        .feed-columns { display:grid; grid-template-columns:minmax(300px, .85fr) minmax(0, 1.4fr); gap:1.5rem; align-items:start; }
        .feed-column { min-width:0; }
        .column-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
        .shorts-scroll { display:flex; flex-direction:column; gap:18px; max-height:78vh; overflow-y:auto; padding:2px 8px 14px 2px; scroll-snap-type:y mandatory; scrollbar-width:thin; scrollbar-color:#6d28d9 #18181b; }
        .short-card { position:relative; isolation:isolate; scroll-snap-align:start; height:min(70vh,680px); min-height:430px; border:1px solid rgba(168,85,247,.25); border-radius:24px; overflow:hidden; background:#000; box-shadow:0 12px 38px rgba(0,0,0,.25); }
        .short-card video { width:100%; height:100%; object-fit:contain; background:#000; }
        .short-gradient { position:absolute; inset:35% 0 0; z-index:1; pointer-events:none; background:linear-gradient(transparent,rgba(0,0,0,.88)); }
        .short-meta { position:absolute; z-index:2; left:16px; right:72px; bottom:18px; }
        .short-actions { position:absolute; z-index:3; right:12px; bottom:24px; display:flex; flex-direction:column; align-items:center; gap:18px; }
        .short-action { width:48px; min-height:48px; border-radius:999px; background:rgba(24,24,27,.82); border:1px solid rgba(255,255,255,.16); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:#fff; transition:transform .18s,background .18s; }
        .short-action:hover { transform:scale(1.06); background:rgba(124,58,237,.9); }
        .short-action span { font-size:10px; font-weight:800; }
        .video-title-button { text-align:left; width:100%; font-weight:800; color:#fff; line-height:1.35; }
        .video-title-button:hover { color:#d8b4fe; }
        .video-description { white-space:pre-wrap; overflow-wrap:anywhere; }
        .long-list { display:flex; flex-direction:column; gap:18px; }
        .long-card { overflow:hidden; border:1px solid rgba(63,63,70,.8); border-radius:22px; background:rgba(18,18,22,.8); }
        .long-card video { display:block; width:100%; aspect-ratio:16/9; background:#000; object-fit:contain; }
        .empty-state { border:1px solid #27272a; border-radius:22px; padding:40px 18px; text-align:center; color:#a1a1aa; }
        @media (max-width: 850px) { .feed-columns { grid-template-columns:minmax(0,1fr); } .shorts-scroll { max-height:75vh; } .short-card { height:min(72vh,700px); min-height:420px; max-width:460px; width:100%; margin-inline:auto; } }
        @media (max-width: 480px) { .short-card { min-height:420px; height:68vh; border-radius:18px; } .short-meta { left:12px; right:64px; bottom:14px; } .short-actions { right:8px; bottom:18px; } }

    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen flex flex-col selection:bg-purple-500 selection:text-white">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 glass-panel border-b border-zinc-800/80 px-4 lg:px-8 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-pink-500 flex items-center justify-center neon-glow-sm">
                <i class="fa-solid fa-wand-magic-sparkles text-white text-lg"></i>
            </div>
            <div>
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-purple-200 to-purple-400 bg-clip-text text-transparent">BeaCreator</span>
                <span class="hidden sm:inline-block ml-2 px-2 py-0.5 text-[10px] font-semibold bg-purple-950/80 text-purple-300 rounded-full border border-purple-800/50">Community Hub</span>
            </div>
        </div>

        <nav class="hidden md:flex items-center space-x-1 bg-zinc-900/90 p-1.5 rounded-2xl border border-zinc-800">
            <button onclick="window.location.href='index.html'" class="px-4 py-2 rounded-xl text-xs font-semibold text-zinc-400 hover:text-white transition-all flex items-center space-x-2">
                <i class="fa-solid fa-house"></i>
                <span>Studio</span>
            </button>
            <button class="px-4 py-2 rounded-xl text-xs font-semibold bg-purple-600 text-white shadow-lg shadow-purple-600/30 flex items-center space-x-2">
                <i class="fa-solid fa-users"></i>
                <span>Community Feed</span>
            </button>
        </nav>

        <div class="flex items-center space-x-3">
            <button onclick="openUploadModal()" class="px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs transition-all shadow-lg shadow-purple-600/30 flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>Upload Video</span>
            </button>
        </div>
    </header>

    <!-- MAIN FEED -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 lg:p-6 pb-28 space-y-6">
        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-purple-950/60 via-indigo-950/40 to-zinc-900 border border-purple-500/20 p-6 lg:p-8 neon-glow">
            <div class="max-w-2xl space-y-3">
                <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/30 text-purple-300 text-xs font-semibold">
                    <i class="fa-solid fa-fire text-purple-400"></i>
                    <span>Creator Showcase & Feedback Arena</span>
                </div>
                <h1 class="text-2xl lg:text-4xl font-extrabold text-white">Explore Creator Shorts & Long Videos</h1>
                <p class="text-zinc-400 text-xs lg:text-sm">Upload original MP4 video files to share globally with creators worldwide.</p>
            </div>
        </div>

        <!-- Feed filters -->
        <div class="flex flex-wrap items-center gap-2 border-b border-zinc-800 pb-3">
            <button onclick="filterVideos('all')" id="filter-all" class="px-4 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold transition-all"><i class="fa-solid fa-layer-group mr-2"></i>All Videos</button>
            <button onclick="filterVideos('short')" id="filter-short" class="px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white text-xs font-bold transition-all"><i class="fa-solid fa-mobile-screen mr-2"></i>Shorts / Reels</button>
            <button onclick="filterVideos('long')" id="filter-long" class="px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white text-xs font-bold transition-all"><i class="fa-solid fa-tv mr-2"></i>Long Videos</button>
        </div>

        <!-- Separate Shorts and Long Video columns -->
        <div id="feed-columns" class="feed-columns">
            <section id="shorts-column" class="feed-column">
                <div class="column-heading">
                    <h2 class="text-lg font-extrabold text-white"><i class="fa-solid fa-mobile-screen-button text-purple-400 mr-2"></i>Shorts</h2>
                    <span class="text-xs text-zinc-500">Scroll vertically</span>
                </div>
                <div id="shorts-feed" class="shorts-scroll"><div class="empty-state">Loading Shorts...</div></div>
            </section>
            <section id="long-column" class="feed-column">
                <div class="column-heading">
                    <h2 class="text-lg font-extrabold text-white"><i class="fa-solid fa-clapperboard text-purple-400 mr-2"></i>Long Videos</h2>
                    <span class="text-xs text-zinc-500">Landscape videos</span>
                </div>
                <div id="long-feed" class="long-list"><div class="empty-state">Loading long videos...</div></div>
            </section>
        </div>
    </main>

    <!-- UPLOAD MODAL -->
    <div id="upload-modal" class="fixed inset-0 z-50 bg-[#09090b]/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-lg p-6 rounded-3xl border border-purple-500/30 neon-glow space-y-4 relative">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-video text-purple-400 mr-2"></i>Upload Global Video</h3>
                <button onclick="closeUploadModal()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form onsubmit="handleGlobalUpload(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-zinc-300">Video Title</label>
                    <input type="text" id="vid-title" required placeholder="e.g., How I Gained 10k Subs in 30 Days" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-zinc-300">Format</label>
                        <select id="vid-type" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                            <option value="short">Short / Reel (Vertical 9:16)</option>
                            <option value="long">Long Video (Horizontal 16:9)</option>
                        </select>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-zinc-300">Select Video File (.mp4)</label>
                        <input type="file" id="vid-file" accept="video/mp4,video/webm" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-xs text-zinc-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-purple-600 file:text-white">
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-zinc-300">Description / Hook Strategy</label>
                    <textarea id="vid-desc" rows="3" required placeholder="Explain your hook or what viewers will learn..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 resize-none"></textarea>
                </div>
                <button type="submit" id="upload-submit-btn" class="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm transition-all shadow-lg shadow-purple-600/30 flex items-center justify-center space-x-2">
                    <span>Publish Globally</span>
                </button>
            </form>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        // PASTE YOUR SUPABASE PROJECT URL AND ANON KEY HERE
        const SUPABASE_URL = "https://kdanylytvxsktgosvgjw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_bhk8btpWpfdFtgxnkV05-w_rbkKl3Ye";

        let supabaseClient = null;
        try {
            if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Supabase init error:", e);
        }

        let currentFilter = 'all';

        window.addEventListener('DOMContentLoaded', () => loadGlobalVideos('all'));

        function openUploadModal() {
            const modal = document.getElementById('upload-modal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeUploadModal() {
            const modal = document.getElementById('upload-modal');
            if (modal) modal.classList.add('hidden');
        }

        async function handleGlobalUpload(event) {
            event.preventDefault();
            if (!supabaseClient) {
                alert('Supabase is not connected. Check the project URL and publishable key.');
                return;
            }

            const title = document.getElementById('vid-title').value.trim();
            const type = document.getElementById('vid-type').value;
            const fileInput = document.getElementById('vid-file').files[0];
            const desc = document.getElementById('vid-desc').value.trim();
            const author = (localStorage.getItem('beacreator_user_name') || 'Creator').slice(0, 80);
            const btn = document.getElementById('upload-submit-btn');

            if (!fileInput) return;
            if (!['video/mp4', 'video/webm'].includes(fileInput.type)) {
                alert('Please choose an MP4 or WebM video file.');
                return;
            }
            const maxBytes = 50 * 1024 * 1024;
            if (fileInput.size > maxBytes) {
                alert('For this basic uploader, choose a video smaller than 50 MB.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Uploading to Cloud...';
            try {
                const fileName = `${Date.now()}_${fileInput.name.replace(/[^a-zA-Z0-9._-]/g, '')}`;
                const { error: storageError } = await supabaseClient.storage.from('videos').upload(fileName, fileInput, { contentType: fileInput.type, upsert: false });
                if (storageError) throw new Error('Storage Error: ' + storageError.message);

                const { data: publicUrlData } = supabaseClient.storage.from('videos').getPublicUrl(fileName);
                const videoUrl = publicUrlData.publicUrl;
                const { error: dbError } = await supabaseClient.from('videos').insert([
                    { title, description: desc, video_url: videoUrl, format: type, author, likes: 0 }
                ]);
                if (dbError) throw new Error('Database Error: ' + dbError.message);

                closeUploadModal();
                document.getElementById('vid-title').value = '';
                document.getElementById('vid-desc').value = '';
                document.getElementById('vid-file').value = '';
                await loadGlobalVideos(currentFilter);
            } catch (error) {
                alert(error.message || 'Upload failed. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Publish Globally</span>';
            }
        }

        function filterVideos(filter) {
            currentFilter = filter;
            ['all', 'short', 'long'].forEach(type => {
                const button = document.getElementById(`filter-${type}`);
                if (!button) return;
                button.className = type === filter
                    ? 'px-4 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold transition-all'
                    : 'px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white text-xs font-bold transition-all';
            });
            document.getElementById('shorts-column').classList.toggle('hidden', filter === 'long');
            document.getElementById('long-column').classList.toggle('hidden', filter === 'short');
            loadGlobalVideos(filter);
        }

        async function loadGlobalVideos(filter) {
            const shortsFeed = document.getElementById('shorts-feed');
            const longFeed = document.getElementById('long-feed');
            shortsFeed.innerHTML = '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading Shorts...</div>';
            longFeed.innerHTML = '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading long videos...</div>';

            if (!supabaseClient) {
                const message = '<div class="empty-state text-amber-300">Supabase is not connected. Check the project URL and publishable key in the script.</div>';
                shortsFeed.innerHTML = message;
                longFeed.innerHTML = message;
                return;
            }

            try {
                let query = supabaseClient.from('videos').select('*').order('created_at', { ascending: false });
                if (filter !== 'all') query = query.eq('format', filter);
                const { data: videos, error } = await query;
                if (error) throw error;
                const items = videos || [];
                const shorts = items.filter(video => video.format === 'short');
                const longs = items.filter(video => video.format === 'long');

                shortsFeed.innerHTML = shorts.length ? shorts.map(renderShort).join('') : '<div class="empty-state">No Shorts yet. Be the first to upload one!</div>';
                longFeed.innerHTML = longs.length ? longs.map(renderLong).join('') : '<div class="empty-state">No long videos yet. Be the first to upload one!</div>';
            } catch (error) {
                const message = `<div class="empty-state text-red-300">Could not load videos: ${escapeHtml(error.message || 'Unknown error')}</div>`;
                shortsFeed.innerHTML = message;
                longFeed.innerHTML = message;
            }
        }

        function renderShort(video) {
            const id = Number(video.id);
            const title = escapeHtml(video.title || 'Untitled video');
            const author = escapeHtml(video.author || 'Creator');
            const description = escapeHtml(video.description || 'No description added.');
            const url = safeVideoUrl(video.video_url);
            const likes = Math.max(0, Number(video.likes) || 0);
            const date = video.created_at ? new Date(video.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
            if (!url || !Number.isFinite(id)) return '';
            return `
                <article class="short-card">
                    <video src="${url}" controls playsinline preload="metadata" aria-label="${title}"></video>
                    <div class="short-gradient"></div>
                    <div class="short-meta">
                        <div class="flex items-center gap-2 text-xs text-zinc-200 mb-2">
                            <span class="px-2 py-1 rounded-full bg-purple-600/80 font-bold">SHORT</span>
                            <span>@${author}</span><span>· ${escapeHtml(date)}</span>
                        </div>
                        <button type="button" class="video-title-button text-base" aria-expanded="false" onclick="toggleDescription(${id}, this)">${title} <i class="fa-solid fa-chevron-down text-xs ml-1"></i></button>
                        <p id="description-${id}" class="video-description text-xs text-zinc-200 mt-2 hidden">${description}</p>
                    </div>
                    <div class="short-actions">
                        <button type="button" class="short-action" onclick="likeVideo(${id}, this)" aria-label="Like this Short"><i class="fa-solid fa-heart text-xl text-pink-400"></i><span id="like-count-${id}">${likes}</span></button>
                        <button type="button" class="short-action" onclick="toggleDescription(${id}, document.querySelector('[onclick=\"toggleDescription(${id}, this)\"]'))" aria-label="Show description"><i class="fa-solid fa-align-left text-lg"></i><span>Details</span></button>
                    </div>
                </article>`;
        }

        function renderLong(video) {
            const id = Number(video.id);
            const title = escapeHtml(video.title || 'Untitled video');
            const author = escapeHtml(video.author || 'Creator');
            const description = escapeHtml(video.description || 'No description added.');
            const url = safeVideoUrl(video.video_url);
            const likes = Math.max(0, Number(video.likes) || 0);
            const date = video.created_at ? new Date(video.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
            if (!url || !Number.isFinite(id)) return '';
            return `
                <article class="long-card">
                    <video src="${url}" controls playsinline preload="metadata" aria-label="${title}"></video>
                    <div class="p-4 sm:p-5">
                        <div class="flex items-center justify-between gap-3 text-xs text-zinc-500 mb-2"><span class="px-2 py-1 rounded-full bg-purple-500/10 text-purple-300 font-bold">LONG VIDEO</span><span>${escapeHtml(date)}</span></div>
                        <button type="button" class="video-title-button text-base sm:text-lg" aria-expanded="false" onclick="toggleDescription(${id}, this)">${title} <i class="fa-solid fa-chevron-down text-xs ml-1"></i></button>
                        <div class="text-xs text-zinc-400 mt-1">by ${author}</div>
                        <p id="description-${id}" class="video-description text-sm text-zinc-300 mt-3 hidden">${description}</p>
                        <div class="flex items-center justify-between gap-3 border-t border-zinc-800 mt-4 pt-3"><span class="text-xs text-zinc-500">Creator community</span><button type="button" class="flex items-center gap-2 rounded-xl border border-zinc-700 px-3 py-2 text-sm hover:border-purple-500 hover:text-purple-300" onclick="likeVideo(${id}, this)"><i class="fa-solid fa-heart text-pink-400"></i><span id="like-count-${id}">${likes}</span><span>Like</span></button></div>
                    </div>
                </article>`;
        }

        function toggleDescription(id, button) {
            const description = document.getElementById(`description-${id}`);
            if (!description) return;
            const opening = description.classList.contains('hidden');
            description.classList.toggle('hidden', !opening);
            if (button) {
                button.setAttribute('aria-expanded', String(opening));
                const icon = button.querySelector('i');
                if (icon) icon.className = opening ? 'fa-solid fa-chevron-up text-xs ml-1' : 'fa-solid fa-chevron-down text-xs ml-1';
            }
        }

        async function likeVideo(id, button) {
            if (!supabaseClient || !button) return;
            const countElement = document.getElementById(`like-count-${id}`);
            const current = Number(countElement ? countElement.textContent : 0) || 0;
            button.disabled = true;
            try {
                // Simple prototype update. Use a server-side atomic like system for production.
                const { data, error } = await supabaseClient.from('videos').update({ likes: current + 1 }).eq('id', id).select('likes').single();
                if (error) throw error;
                if (countElement) countElement.textContent = String(data.likes);
            } catch (error) {
                alert('Could not save like: ' + (error.message || 'Please check Supabase update policies.'));
            } finally {
                button.disabled = false;
            }
        }

        function safeVideoUrl(value) {
            try {
                const parsed = new URL(value, window.location.href);
                return ['https:', 'http:'].includes(parsed.protocol) ? escapeHtml(parsed.href) : '';
            } catch (_) { return ''; }
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

    </script>
</body>
</html>
