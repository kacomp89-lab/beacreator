<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeaCreator - AI Content Studio & Strategy Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#4c1d95',
                            neon: '#a855f7',
                            glow: '#c084fc',
                            darkbg: '#09090b',
                            cardbg: '#121216',
                            bordercol: '#27272a'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
        }
        .neon-glow {
            box-shadow: 0 0 25px -5px rgba(168, 85, 247, 0.35);
        }
        .neon-glow-sm {
            box-shadow: 0 0 12px -2px rgba(139, 92, 246, 0.3);
        }
        .glass-panel {
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(39, 39, 42, 0.6);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7c3aed;
        }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen flex flex-col selection:bg-purple-500 selection:text-white">

    <header class="sticky top-0 z-50 glass-panel border-b border-zinc-800/80 px-4 lg:px-8 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-pink-500 flex items-center justify-center neon-glow-sm">
                <i class="fa-solid fa-wand-magic-sparkles text-white text-lg"></i>
            </div>
            <div>
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-purple-200 to-purple-400 bg-clip-text text-transparent">BeaCreator</span>
                <span class="hidden sm:inline-block ml-2 px-2 py-0.5 text-[10px] font-semibold bg-purple-950/80 text-purple-300 rounded-full border border-purple-800/50">Cloud Powered</span>
            </div>
        </div>

        <nav class="hidden md:flex items-center space-x-1 bg-zinc-900/90 p-1.5 rounded-2xl border border-zinc-800">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-2 bg-purple-600 text-white shadow-lg shadow-purple-600/30">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Dashboard</span>
            </button>
            <button onclick="switchTab('chat')" id="nav-chat" class="nav-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-2 text-zinc-400 hover:text-white hover:bg-zinc-800/60">
                <i class="fa-solid fa-robot"></i>
                <span>AI Chatbot</span>
            </button>
            <button onclick="switchTab('generator')" id="nav-generator" class="nav-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-2 text-zinc-400 hover:text-white hover:bg-zinc-800/60">
                <i class="fa-solid fa-lightbulb"></i>
                <span>Idea Generator</span>
            </button>
            <button onclick="switchTab('simulator')" id="nav-simulator" class="nav-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-2 text-zinc-400 hover:text-white hover:bg-zinc-800/60">
                <i class="fa-solid fa-eye"></i>
                <span>CTR Simulator</span>
            </button>
            <button onclick="switchTab('saved')" id="nav-saved" class="nav-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-2 text-zinc-400 hover:text-white hover:bg-zinc-800/60">
                <i class="fa-solid fa-bookmark"></i>
                <span>Saved Vault <span id="saved-badge" class="ml-1 px-1.5 py-0.2 bg-purple-500/20 text-purple-300 rounded-full text-[10px]">0</span></span>
            </button>
            <button onclick="switchTab('tips')" id="nav-tips" class="nav-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-2 text-zinc-400 hover:text-white hover:bg-zinc-800/60">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Tips Hub</span>
            </button>
        </nav>

        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-zinc-900/90 border border-zinc-800 text-xs">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="font-medium text-zinc-300 hidden sm:inline">Backend Connected</span>
            </div>

            <button onclick="switchTab('chat')" class="md:hidden p-2.5 rounded-xl bg-purple-600 text-white">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6 pb-20">

        <!-- VIEW 1: DASHBOARD -->
        <section id="view-dashboard" class="space-y-6">
            <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-purple-950/60 via-indigo-950/40 to-zinc-900 border border-purple-500/20 p-6 lg:p-10 neon-glow">
                <div class="absolute -right-10 -bottom-10 w-80 h-80 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="relative z-10 max-w-2xl space-y-4">
                    <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/30 text-purple-300 text-xs font-semibold">
                        <i class="fa-solid fa-bolt text-purple-400"></i>
                        <span>Instant Access • No API Key Setup Required</span>
                    </div>
                    <h1 class="text-3xl lg:text-5xl font-extrabold tracking-tight text-white leading-tight">
                        Create Viral Content With <span class="bg-gradient-to-r from-purple-400 via-pink-400 to-indigo-400 bg-clip-text text-transparent">AI Content Studio</span>
                    </h1>
                    <p class="text-zinc-400 text-sm lg:text-base leading-relaxed">
                        Generate data-driven video hooks, scripts, and content strategies instantly through our secure cloud backend.
                    </p>
                    <div class="flex flex-wrap gap-3 pt-2">
                        <button onclick="switchTab('generator')" class="px-5 py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm transition-all shadow-lg shadow-purple-600/30 flex items-center space-x-2">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                            <span>Generate Viral Ideas</span>
                        </button>
                        <button onclick="switchTab('simulator')" class="px-5 py-3 rounded-xl bg-zinc-900 hover:
